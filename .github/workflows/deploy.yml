name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deploy; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Before Cloudflare DNS is connected, publish at the repository subpath.
      # Set the repository variable CUSTOM_DOMAIN_ACTIVE=true only after
      # glasses.amalano.dev resolves to amalano.github.io.
      SITE_BASE: ${{ vars.CUSTOM_DOMAIN_ACTIVE == 'true' && '/' || '/amalano-glass/' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Keep the pre-DNS preview on the GitHub Pages URL
        if: ${{ vars.CUSTOM_DOMAIN_ACTIVE != 'true' }}
        run: rm -f dist/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
